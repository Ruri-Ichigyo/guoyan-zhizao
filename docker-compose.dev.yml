version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: gyz-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gyz}
      POSTGRES_USER: ${POSTGRES_USER:-gyz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gyz123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gyz} -d ${POSTGRES_DB:-gyz}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gyz-redis
    command: ["redis-server", "--save", "900", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
