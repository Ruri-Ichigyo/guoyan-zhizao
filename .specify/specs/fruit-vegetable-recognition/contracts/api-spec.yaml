openapi: 3.0.3
info:
  title: Fruit & Vegetable Recognition API
  description: |
    Lightweight API for uploading produce images, retrieving AI classification results,
    and viewing historical records and statistics.

    **Base URL**: `/api/v1`

    **Constitutional Compliance**: This API satisfies NFR6 (100% documentation coverage).
  version: 1.0.0
  contact:
    name: 果蔬智造核心平台
    url: https://github.com/lanshi17/guoyan-zhizao

servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: https://staging.guoyan.example.com/api/v1
    description: Staging environment
  - url: https://api.guoyan.example.com/api/v1
    description: Production environment

tags:
  - name: uploads
    description: Image upload and classification operations
  - name: results
    description: Historical classification results
  - name: statistics
    description: Aggregate analytics and usage insights
  - name: health
    description: System health monitoring

paths:
  /uploads:
    post:
      tags:
        - uploads
      summary: Upload image and trigger AI classification
      description: |
        Uploads a produce image, validates format/size, stores it, triggers AI classification,
        and returns the result. If an identical image (by SHA-256 hash) was already uploaded,
        returns cached result.

        **Performance**: P95 latency ≤5 seconds (Constitutional Principle 4).
      operationId: uploadImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (JPEG, PNG, or WebP)
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: Image uploaded and classified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
              example:
                success: true
                data:
                  id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  produce_type: "apple"
                  confidence: 0.96
                  image_url: "/uploads/2025/10/13/a1b2c3d4.jpg"
                  timestamp: "2025-10-13T10:00:00Z"
                  inference_time_ms: 1234
                error: null
                metadata:
                  timestamp: "2025-10-13T10:00:01Z"
                  request_id: "req-12345"
        '400':
          description: Invalid request (bad file format, size, or missing file)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_format:
                  value:
                    success: false
                    data: null
                    error:
                      code: "INVALID_FILE_FORMAT"
                      message: "Please upload JPEG, PNG, or WebP"
                      details:
                        provided_content_type: "image/bmp"
                    metadata:
                      timestamp: "2025-10-13T10:00:00Z"
                      request_id: "req-12346"
                missing_file:
                  value:
                    success: false
                    data: null
                    error:
                      code: "MISSING_FILE"
                      message: "No file provided in request"
                      details: {}
        '413':
          description: Payload too large (file >10MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error:
                  code: "FILE_TOO_LARGE"
                  message: "Image must be under 10MB, please resize"
                  details:
                    file_size_bytes: 12582912
                    max_allowed_bytes: 10485760
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: AI service unavailable (circuit breaker open)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error:
                  code: "AI_SERVICE_UNAVAILABLE"
                  message: "Classification temporarily unavailable, please try again"
                  details:
                    circuit_state: "open"
                    retry_after_seconds: 60

  /results:
    get:
      tags:
        - results
      summary: List historical classification results (paginated)
      description: |
        Retrieves a paginated list of classification results, sorted by most recent first.

        **Performance**: P95 latency ≤2 seconds for 100+ records (Constitutional Principle 4).
      operationId: listResults
      parameters:
        - name: page
          in: query
          description: Page number (1-indexed)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Results per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: List of results retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultsListResponse'
              example:
                success: true
                data:
                  results:
                    - id: "a1b2c3d4"
                      produce_type: "banana"
                      confidence: 0.94
                      thumbnail_url: "/uploads/2025/10/13/a1b2c3d4_thumb.jpg"
                      timestamp: "2025-10-13T09:30:00Z"
                    - id: "b2c3d4e5"
                      produce_type: "apple"
                      confidence: 0.96
                      thumbnail_url: "/uploads/2025/10/13/b2c3d4e5_thumb.jpg"
                      timestamp: "2025-10-13T09:25:00Z"
                  pagination:
                    total: 1247
                    page: 1
                    limit: 20
                    total_pages: 63
                error: null
                metadata:
                  timestamp: "2025-10-13T10:00:00Z"
                  request_id: "req-12347"
        '400':
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /results/{id}:
    get:
      tags:
        - results
      summary: Get single classification result details
      description: Retrieves full details for a specific classification result, including full-size image URL and metadata.
      operationId: getResultById
      parameters:
        - name: id
          in: path
          description: Upload ID (UUID)
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Result details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDetailResponse'
              example:
                success: true
                data:
                  id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  produce_type: "tomato"
                  confidence: 0.91
                  image_url: "/uploads/2025/10/13/a1b2c3d4.jpg"
                  original_filename: "garden_tomato.jpg"
                  file_size_bytes: 2048000
                  timestamp: "2025-10-13T09:15:00Z"
                  inference_time_ms: 1234
                  model_version: "mobilenetv3-v1.2.0"
                  metadata:
                    top_predictions:
                      - class: "tomato"
                        confidence: 0.91
                      - class: "red_pepper"
                        confidence: 0.06
                      - class: "strawberry"
                        confidence: 0.02
                error: null
                metadata:
                  timestamp: "2025-10-13T10:00:00Z"
                  request_id: "req-12348"
        '404':
          description: Result not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error:
                  code: "RESULT_NOT_FOUND"
                  message: "No result found with the provided ID"
                  details:
                    provided_id: "nonexistent-uuid"

  /statistics:
    get:
      tags:
        - statistics
      summary: Get aggregate statistics and usage insights
      description: |
        Retrieves system-wide statistics including total uploads, top recognized produce types,
        average confidence, and upload trends over time.

        **Performance**: P95 latency ≤3 seconds (Constitutional Principle 4).
        **Caching**: Results cached for 5 minutes to reduce database load.
      operationId: getStatistics
      responses:
        '200':
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsResponse'
              example:
                success: true
                data:
                  total_uploads: 1247
                  top_produce:
                    - name: "apple"
                      count: 287
                      percentage: 23.0
                    - name: "banana"
                      count: 224
                      percentage: 18.0
                    - name: "tomato"
                      count: 187
                      percentage: 15.0
                    - name: "cucumber"
                      count: 149
                      percentage: 12.0
                    - name: "orange"
                      count: 124
                      percentage: 10.0
                  average_confidence: 0.94
                  upload_trends:
                    - date: "2025-10-13"
                      count: 47
                    - date: "2025-10-12"
                      count: 52
                    - date: "2025-10-11"
                      count: 38
                error: null
                metadata:
                  timestamp: "2025-10-13T10:00:00Z"
                  request_id: "req-12349"
                  cache_hit: true

  /health:
    get:
      tags:
        - health
      summary: System health check
      description: |
        Checks health of all system components: PostgreSQL, Redis, and AI service.
        Returns overall status and individual component statuses.
      operationId: healthCheck
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "healthy"
                components:
                  database:
                    status: "up"
                    response_time_ms: 12
                  redis:
                    status: "up"
                    response_time_ms: 5
                  ai_service:
                    status: "up"
                    response_time_ms: 1200
                timestamp: "2025-10-13T10:00:00Z"
        '503':
          description: System is unhealthy or degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "degraded"
                components:
                  database:
                    status: "up"
                    response_time_ms: 15
                  redis:
                    status: "up"
                    response_time_ms: 8
                  ai_service:
                    status: "down"
                    response_time_ms: null
                    error: "Connection timeout after 5000ms"
                timestamp: "2025-10-13T10:00:00Z"

components:
  schemas:
    UploadResponse:
      type: object
      required:
        - success
        - data
        - error
        - metadata
      properties:
        success:
          type: boolean
          description: Request success indicator
        data:
          type: object
          nullable: true
          required:
            - id
            - produce_type
            - confidence
            - image_url
            - timestamp
          properties:
            id:
              type: string
              format: uuid
              description: Upload ID
            produce_type:
              type: string
              description: Classified produce name
              example: "apple"
            confidence:
              type: number
              format: float
              minimum: 0.0
              maximum: 1.0
              description: Model confidence score (0.0-1.0)
            image_url:
              type: string
              description: Relative URL to uploaded image
              example: "/uploads/2025/10/13/abc123.jpg"
            timestamp:
              type: string
              format: date-time
              description: Upload timestamp (ISO 8601)
            inference_time_ms:
              type: integer
              description: AI inference duration in milliseconds
        error:
          type: object
          nullable: true
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'

    ResultsListResponse:
      type: object
      required:
        - success
        - data
        - error
        - metadata
      properties:
        success:
          type: boolean
        data:
          type: object
          nullable: true
          required:
            - results
            - pagination
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/ResultSummary'
            pagination:
              $ref: '#/components/schemas/PaginationInfo'
        error:
          type: object
          nullable: true
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'

    ResultDetailResponse:
      type: object
      required:
        - success
        - data
        - error
        - metadata
      properties:
        success:
          type: boolean
        data:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ResultSummary'
            - type: object
              properties:
                original_filename:
                  type: string
                  description: User's original filename
                file_size_bytes:
                  type: integer
                  description: Image file size in bytes
                inference_time_ms:
                  type: integer
                  description: AI inference duration
                model_version:
                  type: string
                  description: Model identifier
                metadata:
                  type: object
                  description: Additional model output (JSONB)
                  nullable: true
                  properties:
                    top_predictions:
                      type: array
                      items:
                        type: object
                        properties:
                          class:
                            type: string
                          confidence:
                            type: number
        error:
          type: object
          nullable: true
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'

    StatisticsResponse:
      type: object
      required:
        - success
        - data
        - error
        - metadata
      properties:
        success:
          type: boolean
        data:
          type: object
          nullable: true
          required:
            - total_uploads
            - top_produce
            - average_confidence
            - upload_trends
          properties:
            total_uploads:
              type: integer
              description: Total number of uploads (all time)
            top_produce:
              type: array
              items:
                $ref: '#/components/schemas/ProduceCount'
              description: Top recognized produce types
            average_confidence:
              type: number
              format: float
              description: Average confidence score across all results
            upload_trends:
              type: array
              items:
                $ref: '#/components/schemas/UploadTrend'
              description: Daily upload counts (last 30 days)
        error:
          type: object
          nullable: true
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'

    HealthResponse:
      type: object
      required:
        - status
        - components
        - timestamp
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
          description: Overall system health
        components:
          type: object
          required:
            - database
            - redis
            - ai_service
          properties:
            database:
              $ref: '#/components/schemas/ComponentHealth'
            redis:
              $ref: '#/components/schemas/ComponentHealth'
            ai_service:
              $ref: '#/components/schemas/ComponentHealth'
        timestamp:
          type: string
          format: date-time
          description: Health check timestamp

    ErrorResponse:
      type: object
      required:
        - success
        - data
        - error
        - metadata
      properties:
        success:
          type: boolean
          enum: [false]
        data:
          type: object
          nullable: true
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code
              example: "INVALID_FILE_FORMAT"
            message:
              type: string
              description: Human-readable error message
              example: "Please upload JPEG, PNG, or WebP"
            details:
              type: object
              description: Additional error context
              additionalProperties: true
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'

    ResultSummary:
      type: object
      required:
        - id
        - produce_type
        - confidence
        - thumbnail_url
        - timestamp
      properties:
        id:
          type: string
          format: uuid
        produce_type:
          type: string
        confidence:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        thumbnail_url:
          type: string
          description: URL to image thumbnail (optimized for grid display)
        image_url:
          type: string
          description: URL to full-size image
        timestamp:
          type: string
          format: date-time

    ProduceCount:
      type: object
      required:
        - name
        - count
        - percentage
      properties:
        name:
          type: string
          description: Produce type name
        count:
          type: integer
          description: Number of occurrences
        percentage:
          type: number
          format: float
          description: Percentage of total uploads

    UploadTrend:
      type: object
      required:
        - date
        - count
      properties:
        date:
          type: string
          format: date
          description: Date (YYYY-MM-DD)
        count:
          type: integer
          description: Number of uploads on this date

    ComponentHealth:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [up, down]
        response_time_ms:
          type: integer
          nullable: true
          description: Component response time (null if down)
        error:
          type: string
          nullable: true
          description: Error message if component is down

    PaginationInfo:
      type: object
      required:
        - total
        - page
        - limit
        - total_pages
      properties:
        total:
          type: integer
          description: Total number of results across all pages
        page:
          type: integer
          description: Current page number (1-indexed)
        limit:
          type: integer
          description: Results per page
        total_pages:
          type: integer
          description: Total number of pages

    ResponseMetadata:
      type: object
      required:
        - timestamp
        - request_id
      properties:
        timestamp:
          type: string
          format: date-time
          description: Response timestamp
        request_id:
          type: string
          description: Unique request identifier for tracing
        cache_hit:
          type: boolean
          description: Whether response was served from cache
