apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-service
  namespace: fruit-sort
  labels:
    app: query-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: query-service
  template:
    metadata:
      labels:
        app: query-service
        tier: backend
    spec:
      containers:
      - name: query-service
        image: your-registry/fruit-sort/query-service:latest
        ports:
        - containerPort: 3002
        env:
        # Database Configuration
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: fruit-sort-secrets
              key: DATABASE_URL
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: DATABASE_HOST
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: DATABASE_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fruit-sort-secrets
              key: POSTGRES_PASSWORD

        # Redis Configuration
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: fruit-sort-secrets
              key: REDIS_URL
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fruit-sort-secrets
              key: REDIS_PASSWORD

        # Kafka Configuration
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: KAFKA_TOPIC_IMAGE_EVENTS
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: KAFKA_TOPIC_IMAGE_EVENTS
        - name: KAFKA_TOPIC_INFERENCE_RESULTS
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: KAFKA_TOPIC_INFERENCE_RESULTS

        # MinIO Configuration
        - name: MINIO_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: MINIO_ENDPOINT
        - name: MINIO_BUCKET
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: MINIO_BUCKET
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: fruit-sort-secrets
              key: MINIO_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: fruit-sort-secrets
              key: MINIO_SECRET_KEY

        # Application Configuration
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: LOG_LEVEL
        - name: API_VERSION
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: API_VERSION
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: fruit-sort-secrets
              key: JWT_SECRET
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: fruit-sort-secrets
              key: API_KEY

        # Service specific
        - name: PORT
          value: "3002"
        - name: NODE_ENV
          value: "production"
        - name: SERVICE_NAME
          value: "query-service"
        - name: CACHE_TTL
          value: "3600"
        - name: MAX_QUERY_RESULTS
          value: "1000"

        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        volumeMounts:
        - name: app-logs
          mountPath: /app/logs
        - name: temp-data
          mountPath: /tmp/query-cache

      volumes:
      - name: app-logs
        emptyDir:
          sizeLimit: 1Gi
      - name: temp-data
        emptyDir:
          sizeLimit: 5Gi

      imagePullSecrets:
      - name: registry-secret

---
apiVersion: v1
kind: Service
metadata:
  name: query-service
  namespace: fruit-sort
  labels:
    app: query-service
spec:
  selector:
    app: query-service
  ports:
  - port: 3002
    targetPort: 3002
    protocol: TCP
    name: http
  type: ClusterIP
  sessionAffinity: None

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: query-service-network-policy
  namespace: fruit-sort
spec:
  podSelector:
    matchLabels:
      app: query-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: kong
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - protocol: TCP
      port: 3002
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: kafka
    ports:
    - protocol: TCP
      port: 9092
  - to:
    - podSelector:
        matchLabels:
          app: minio
    ports:
    - protocol: TCP
      port: 9000
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: query-service-pdb
  namespace: fruit-sort
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: query-service

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: query-service-hpa
  namespace: fruit-sort
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: query-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

---
apiVersion: v1
kind: ServiceMonitor
metadata:
  name: query-service-metrics
  namespace: fruit-sort
  labels:
    app: query-service
spec:
  selector:
    matchLabels:
      app: query-service
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s