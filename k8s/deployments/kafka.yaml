apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: fruit-sort
  labels:
    app: kafka
data:
  server.properties: |
    # Licensed to the Apache Software Foundation (ASF) under one or more
    # contributor license agreements.  See the NOTICE file distributed with
    # this work for additional information regarding copyright ownership.
    # The ASF licenses this file to You under the Apache License, Version 2.0
    # (the "License"); you may not use this file except in compliance with
    # the License.  You may obtain a copy of the License at
    #
    #    http://www.apache.org/licenses/LICENSE-2.0
    #
    # Unless required by applicable law or agreed to in writing, software
    # distributed under the License is distributed on an "AS IS" BASIS,
    # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
    # See the License for the specific language governing permissions and
    # limitations under the License.

    # Server Basics
    broker.id=1

    # Socket Server Settings
    listeners=PLAINTEXT://0.0.0.0:9092
    advertised.listeners=PLAINTEXT://kafka-service:9092

    # Log Basics
    log.dirs=/var/kafka-logs

    # Topic settings
    num.network.threads=3
    num.io.threads=8
    socket.send.buffer.bytes=102400
    socket.receive.buffer.bytes=102400
    socket.request.max.bytes=104857600

    # Log Flush Policy
    log.flush.interval.messages=10000
    log.flush.interval.ms=1000

    # Log Retention Policy
    log.retention.hours=168
    log.retention.bytes=1073741824
    log.segment.bytes=1073741824
    log.retention.check.interval.ms=300000

    # Zookeeper
    zookeeper.connect=zookeeper-service:2181
    zookeeper.connection.timeout.ms=18000

    # Group Coordinator Settings
    group.initial.rebalance.delay.ms=0

    # Topic Creation
    auto.create.topics.enable=true
    default.replication.factor=1
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zookeeper-config
  namespace: fruit-sort
  labels:
    app: zookeeper
data:
  zoo.cfg: |
    tickTime=2000
    initLimit=10
    syncLimit=5
    dataDir=/var/lib/zookeeper
    dataLogDir=/var/lib/zookeeper/log
    clientPort=2181
    maxClientCnxns=60
    autopurge.snapRetainCount=3
    autopurge.purgeInterval=1
    admin.enableServer=false

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: fruit-sort
  labels:
    app: zookeeper
    component: zookeeper
spec:
  serviceName: zookeeper-headless
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
        component: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.4.0
        ports:
        - containerPort: 2181
          name: client
        - containerPort: 2888
          name: server
        - containerPort: 3888
          name: leader-election
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
        - name: ZOOKEEPER_INIT_LIMIT
          value: "10"
        - name: ZOOKEEPER_SYNC_LIMIT
          value: "5"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - "echo ruok | nc localhost 2181 | grep imok"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - "echo ruok | nc localhost 2181 | grep imok"
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - name: zookeeper-storage
          mountPath: /var/lib/zookeeper
        - name: zookeeper-config-volume
          mountPath: /etc/zookeeper
          readOnly: true
      volumes:
      - name: zookeeper-config-volume
        configMap:
          name: zookeeper-config
  volumeClaimTemplates:
  - metadata:
      name: zookeeper-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
  namespace: fruit-sort
  labels:
    app: zookeeper
spec:
  selector:
    app: zookeeper
  ports:
  - port: 2181
    targetPort: 2181
    name: client
  - port: 2888
    targetPort: 2888
    name: server
  - port: 3888
    targetPort: 3888
    name: leader-election
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-headless
  namespace: fruit-sort
  labels:
    app: zookeeper
spec:
  clusterIP: None
  selector:
    app: zookeeper
  ports:
  - port: 2181
    targetPort: 2181
    name: client
  - port: 2888
    targetPort: 2888
    name: server
  - port: 3888
    targetPort: 3888
    name: leader-election

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: fruit-sort
  labels:
    app: kafka
    component: kafka
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
        component: kafka
        tier: messaging
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.4.0
        ports:
        - containerPort: 9092
          name: kafka
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper-service:2181"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://0.0.0.0:9092"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka-service:9092"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: "true"
        - name: KAFKA_DEFAULT_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_LOG_RETENTION_HOURS
          value: "168"
        - name: KAFKA_LOG_RETENTION_BYTES
          value: "1073741824"
        - name: KAFKA_HEAP_OPTS
          value: "-Xmx1G -Xms1G"
        resources:
          requests:
            memory: "1Gi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - "kafka-topics --bootstrap-server localhost:9092 --list"
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - "kafka-topics --bootstrap-server localhost:9092 --list"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: kafka-storage
          mountPath: /var/kafka-logs
        - name: kafka-config-volume
          mountPath: /etc/kafka
          readOnly: true
      volumes:
      - name: kafka-config-volume
        configMap:
          name: kafka-config
      initContainers:
      - name: wait-for-zookeeper
        image: busybox:1.35
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for Zookeeper to be ready..."
          until nc -z zookeeper-service 2181; do
            echo "Zookeeper is not ready yet. Sleeping for 10 seconds..."
            sleep 10
          done
          echo "Zookeeper is ready!"
  volumeClaimTemplates:
  - metadata:
      name: kafka-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 50Gi

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: fruit-sort
  labels:
    app: kafka
spec:
  selector:
    app: kafka
  ports:
  - port: 9092
    targetPort: 9092
    name: kafka
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: fruit-sort
  labels:
    app: kafka
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
  - port: 9092
    targetPort: 9092
    name: kafka

---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  namespace: fruit-sort
spec:
  template:
    metadata:
      labels:
        app: kafka-topic-init
    spec:
      containers:
      - name: kafka-topic-init
        image: confluentinc/cp-kafka:7.4.0
        command:
        - /bin/bash
        - -c
        - |
          echo "Waiting for Kafka to be ready..."
          until kafka-topics --bootstrap-server kafka-service:9092 --list; do
            echo "Kafka is not ready yet. Sleeping for 10 seconds..."
            sleep 10
          done

          echo "Creating topics..."
          kafka-topics --bootstrap-server kafka-service:9092 --create --if-not-exists --topic image-events --partitions 3 --replication-factor 1
          kafka-topics --bootstrap-server kafka-service:9092 --create --if-not-exists --topic inference-results --partitions 3 --replication-factor 1
          kafka-topics --bootstrap-server kafka-service:9092 --create --if-not-exists --topic sorting-commands --partitions 3 --replication-factor 1
          kafka-topics --bootstrap-server kafka-service:9092 --create --if-not-exists --topic system-metrics --partitions 1 --replication-factor 1

          echo "Topics created successfully!"
          kafka-topics --bootstrap-server kafka-service:9092 --list
      restartPolicy: OnFailure
  backoffLimit: 5

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-network-policy
  namespace: fruit-sort
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          tier: backend
    - podSelector:
        matchLabels:
          app: ai-inference
    - podSelector:
        matchLabels:
          app: upload-service
    - podSelector:
        matchLabels:
          app: query-service
    - podSelector:
        matchLabels:
          app: sort-service
    ports:
    - protocol: TCP
      port: 9092
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: zookeeper
    ports:
    - protocol: TCP
      port: 2181
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zookeeper-network-policy
  namespace: fruit-sort
spec:
  podSelector:
    matchLabels:
      app: zookeeper
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: kafka
    ports:
    - protocol: TCP
      port: 2181
    - protocol: TCP
      port: 2888
    - protocol: TCP
      port: 3888
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka-pdb
  namespace: fruit-sort
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app: kafka

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zookeeper-pdb
  namespace: fruit-sort
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app: zookeeper