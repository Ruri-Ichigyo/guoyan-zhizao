apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-inference
  namespace: fruit-sort
  labels:
    app: ai-inference
    tier: ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-inference
  template:
    metadata:
      labels:
        app: ai-inference
        tier: ai
    spec:
      nodeSelector:
        nvidia.com/gpu: "true"
      containers:
      - name: ai-inference
        image: your-registry/fruit-sort/ai-inference:latest
        ports:
        - containerPort: 3004
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: MINIO_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: MINIO_ENDPOINT
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: fruit-sort-secrets
              key: MINIO_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: fruit-sort-secrets
              key: MINIO_SECRET_KEY
        - name: MODEL_PATH
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: MODEL_PATH
        - name: INFERENCE_BATCH_SIZE
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: INFERENCE_BATCH_SIZE
        - name: CONFIDENCE_THRESHOLD
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: CONFIDENCE_THRESHOLD
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        resources:
          requests:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: 1
          limits:
            memory: "16Gi"
            cpu: "8"
            nvidia.com/gpu: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: model-storage
          mountPath: /app/model
          readOnly: true
        - name: cache-storage
          mountPath: /app/cache
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: model-storage-pvc
      - name: cache-storage
        emptyDir:
          sizeLimit: 20Gi
      imagePullSecrets:
      - name: registry-secret
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"

---
apiVersion: v1
kind: Service
metadata:
  name: ai-inference-service
  namespace: fruit-sort
  labels:
    app: ai-inference
spec:
  selector:
    app: ai-inference
  ports:
  - port: 3004
    targetPort: 3004
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-storage-pvc
  namespace: fruit-sort
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 50Gi

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-inference-hpa
  namespace: fruit-sort
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-inference
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60