apiVersion: apps/v1
kind: Deployment
metadata:
  name: sort-service
  namespace: fruit-sort
  labels:
    app: sort-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sort-service
  template:
    metadata:
      labels:
        app: sort-service
        tier: backend
    spec:
      containers:
      - name: sort-service
        image: your-registry/fruit-sort/sort-service:latest
        ports:
        - containerPort: 3003
        env:
        # Database Configuration
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: fruit-sort-secrets
              key: DATABASE_URL
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: DATABASE_HOST
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: DATABASE_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fruit-sort-secrets
              key: POSTGRES_PASSWORD

        # Redis Configuration
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: fruit-sort-secrets
              key: REDIS_URL
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fruit-sort-secrets
              key: REDIS_PASSWORD

        # Kafka Configuration
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: KAFKA_TOPIC_IMAGE_EVENTS
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: KAFKA_TOPIC_IMAGE_EVENTS
        - name: KAFKA_TOPIC_INFERENCE_RESULTS
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: KAFKA_TOPIC_INFERENCE_RESULTS

        # MinIO Configuration
        - name: MINIO_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: MINIO_ENDPOINT
        - name: MINIO_BUCKET
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: MINIO_BUCKET
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: fruit-sort-secrets
              key: MINIO_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: fruit-sort-secrets
              key: MINIO_SECRET_KEY

        # Application Configuration
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: LOG_LEVEL
        - name: API_VERSION
          valueFrom:
            configMapKeyRef:
              name: fruit-sort-config
              key: API_VERSION
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: fruit-sort-secrets
              key: JWT_SECRET
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: fruit-sort-secrets
              key: API_KEY

        # Service specific
        - name: PORT
          value: "3003"
        - name: NODE_ENV
          value: "production"
        - name: SERVICE_NAME
          value: "sort-service"
        - name: SORT_BATCH_SIZE
          value: "100"
        - name: MAX_CONCURRENT_SORTS
          value: "5"
        - name: SORT_TIMEOUT
          value: "300"

        # Hardware Control (Mock values for demo)
        - name: CONVEYOR_CONTROL_ENDPOINT
          value: "http://conveyor-controller:8080"
        - name: PNEUMATIC_CONTROL_ENDPOINT
          value: "http://pneumatic-controller:8080"
        - name: SENSOR_ENDPOINT
          value: "http://sensor-gateway:8080"

        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        volumeMounts:
        - name: app-logs
          mountPath: /app/logs
        - name: sort-config
          mountPath: /app/config
          readOnly: true
        - name: temp-data
          mountPath: /tmp/sort-cache

      volumes:
      - name: app-logs
        emptyDir:
          sizeLimit: 1Gi
      - name: sort-config
        configMap:
          name: sort-config
      - name: temp-data
        emptyDir:
          sizeLimit: 2Gi

      imagePullSecrets:
      - name: registry-secret

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sort-config
  namespace: fruit-sort
  labels:
    app: sort-service
data:
  sorting-rules.json: |
    {
      "rules": {
        "apple": {
          "conveyor_speed": 1.2,
          "pneumatic_pressure": 80,
          "sort_bin": 1,
          "quality_check": true
        },
        "banana": {
          "conveyor_speed": 1.0,
          "pneumatic_pressure": 70,
          "sort_bin": 2,
          "quality_check": true
        },
        "orange": {
          "conveyor_speed": 1.1,
          "pneumatic_pressure": 85,
          "sort_bin": 3,
          "quality_check": true
        },
        "grape": {
          "conveyor_speed": 0.8,
          "pneumatic_pressure": 60,
          "sort_bin": 4,
          "quality_check": true
        },
        "strawberry": {
          "conveyor_speed": 0.6,
          "pneumatic_pressure": 50,
          "sort_bin": 5,
          "quality_check": true
        },
        "tomato": {
          "conveyor_speed": 1.0,
          "pneumatic_pressure": 75,
          "sort_bin": 6,
          "quality_check": true
        },
        "carrot": {
          "conveyor_speed": 1.3,
          "pneumatic_pressure": 90,
          "sort_bin": 7,
          "quality_check": false
        },
        "potato": {
          "conveyor_speed": 1.4,
          "pneumatic_pressure": 95,
          "sort_bin": 8,
          "quality_check": false
        },
        "default": {
          "conveyor_speed": 1.0,
          "pneumatic_pressure": 70,
          "sort_bin": 0,
          "quality_check": false
        }
      },
      "quality_thresholds": {
        "confidence_min": 0.7,
        "size_variance_max": 0.2,
        "color_variance_max": 0.3
      },
      "performance": {
        "max_items_per_minute": 120,
        "sort_accuracy_target": 0.95,
        "maintenance_interval_hours": 24
      }
    }

---
apiVersion: v1
kind: Service
metadata:
  name: sort-service
  namespace: fruit-sort
  labels:
    app: sort-service
spec:
  selector:
    app: sort-service
  ports:
  - port: 3003
    targetPort: 3003
    protocol: TCP
    name: http
  type: ClusterIP
  sessionAffinity: None

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sort-service-network-policy
  namespace: fruit-sort
spec:
  podSelector:
    matchLabels:
      app: sort-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: kong
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - protocol: TCP
      port: 3003
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: kafka
    ports:
    - protocol: TCP
      port: 9092
  - to:
    - podSelector:
        matchLabels:
          app: minio
    ports:
    - protocol: TCP
      port: 9000
  # Allow outbound to hardware controllers (mock services)
  - to: []
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sort-service-pdb
  namespace: fruit-sort
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sort-service

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sort-service-hpa
  namespace: fruit-sort
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sort-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

---
apiVersion: v1
kind: ServiceMonitor
metadata:
  name: sort-service-metrics
  namespace: fruit-sort
  labels:
    app: sort-service
spec:
  selector:
    matchLabels:
      app: sort-service
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s

---
# Mock hardware controller services for demonstration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hardware-controller-mock
  namespace: fruit-sort
  labels:
    app: hardware-controller-mock
    tier: hardware
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hardware-controller-mock
  template:
    metadata:
      labels:
        app: hardware-controller-mock
        tier: hardware
    spec:
      containers:
      - name: mock-server
        image: mockserver/mockserver:5.14.0
        ports:
        - containerPort: 1080
        env:
        - name: MOCKSERVER_LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: conveyor-controller
  namespace: fruit-sort
  labels:
    app: hardware-controller-mock
spec:
  selector:
    app: hardware-controller-mock
  ports:
  - port: 8080
    targetPort: 1080
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: pneumatic-controller
  namespace: fruit-sort
  labels:
    app: hardware-controller-mock
spec:
  selector:
    app: hardware-controller-mock
  ports:
  - port: 8080
    targetPort: 1080
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: sensor-gateway
  namespace: fruit-sort
  labels:
    app: hardware-controller-mock
spec:
  selector:
    app: hardware-controller-mock
  ports:
  - port: 8080
    targetPort: 1080
  type: ClusterIP