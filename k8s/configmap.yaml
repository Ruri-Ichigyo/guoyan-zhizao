apiVersion: v1
kind: ConfigMap
metadata:
  name: fruit-sort-config
  namespace: fruit-sort
data:
  # 数据库配置
  POSTGRES_DB: "fruit_sort"
  POSTGRES_USER: "postgres"
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"

  # Redis 配置
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  # Kafka 配置
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  KAFKA_TOPIC_IMAGE_EVENTS: "image-events"
  KAFKA_TOPIC_INFERENCE_RESULTS: "inference-results"

  # MinIO 配置
  MINIO_ENDPOINT: "http://minio-service:9000"
  MINIO_BUCKET: "fruit-images"

  # AI 服务配置
  MODEL_PATH: "/app/model/yolov8n-fruit.pt"
  INFERENCE_BATCH_SIZE: "4"
  CONFIDENCE_THRESHOLD: "0.5"

  # 应用配置
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: "*"
  API_VERSION: "v1"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: fruit-sort
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
        use epoll;
        multi_accept on;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        client_max_body_size 50M;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml+rss
            application/atom+xml
            image/svg+xml;

        upstream api_backend {
            least_conn;
            server kong-service:8000;
        }

        server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;

            # 前端静态资源
            location / {
                try_files $uri $uri/ /index.html;
                expires 1h;
                add_header Cache-Control "public, no-transform";
            }

            # API 代理
            location /api/v1/ {
                proxy_pass http://api_backend;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 30s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;
            }

            # WebSocket 代理
            location /api/v1/ws/ {
                proxy_pass http://api_backend;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "Upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 30s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;
            }

            # 健康检查
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }
    }
